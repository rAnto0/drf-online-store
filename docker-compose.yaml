services:
  nginx:
    build:
      context: ./nginx
    depends_on:
      main-api:
        condition: service_healthy
    ports:
      - "80:8088"
    volumes:
      - ./main-api/zaharovo/logs:/app/zaharovo/logs
  
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  main-api:
    build: ./main-api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8000)); s.close()\""]
      interval: 2s
      timeout: 2s
      retries: 15
  
  frontend:
    build: ./frontend
    env_file:
      - .env
    depends_on:
      main-api:
        condition: service_healthy

volumes:
  postgres_data:
