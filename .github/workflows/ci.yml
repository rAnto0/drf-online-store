name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-conflict-check:
    name: Merge Conflict Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify merge with base branch
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          git merge --no-commit --no-ff "origin/${{ github.event.pull_request.base.ref }}"

  ci:
    name: Lint, Format & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Prepare env file
        run: make env-init

      - name: Start required services
        run: make run-dev

      - name: Wait for PostgreSQL
        run: |
          for i in {1..60}; do
            if docker compose --env-file .env -f docker-compose.yaml -f docker-compose.dev.yaml exec -T db sh -lc 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Run lint
        run: make lint

      - name: Check format
        run: make format-check

      - name: Run tests
        run: make test

      - name: Show containers status on failure
        if: failure()
        run: docker compose --env-file .env -f docker-compose.yaml -f docker-compose.dev.yaml ps

      - name: Tear down
        if: always()
        run: make down-dev ARGS="-v"

  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        service: [main-api, frontend, nginx]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build main-api image
        if: matrix.service == 'main-api'
        uses: docker/build-push-action@v6
        with:
          context: ./main-api
          push: false
          tags: local/main-api:ci
          cache-from: type=gha,scope=main-api
          cache-to: type=gha,mode=max,scope=main-api

      - name: Build frontend image
        if: matrix.service == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: local/frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build nginx image
        if: matrix.service == 'nginx'
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: false
          tags: local/nginx:ci
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx
